name: CI

on:
  push:
    branches: ["main", "production-hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend_quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint and test backend
        working-directory: backend
        run: |
          npm run lint
          npm test
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend types
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          PUBLIC_BACKEND_URL: "https://api.example.com"
        run: npm run build

      - name: Verify browser policy and runtime configuration
        run: |
          node scripts/test-browser-policy.mjs
          node scripts/test-public-config.mjs
          node scripts/test-runtime-connections.mjs
          node scripts/test-dashboard-greeting.mjs
          node scripts/check-client-secrets.mjs

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build and smoke test the frontend container
        run: |
          docker build -t fisio-frontend-ci ./frontend
          docker run --rm fisio-frontend-ci nginx -t
          docker run -d --name fisio-frontend-ci -p 127.0.0.1:8080:80 \
            -e PUBLIC_BACKEND_URL=https://api.example.test \
            -e PUBLIC_SUPABASE_URL=https://example.supabase.co fisio-frontend-ci
          trap 'docker rm -f fisio-frontend-ci' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/health
          curl --fail --silent --dump-header /tmp/fisio-headers http://127.0.0.1:8080/login/ --output /tmp/fisio-login.html
          grep -F "connect-src 'self' https://api.example.test https://example.supabase.co" /tmp/fisio-headers
          grep -F 'no-store' /tmp/fisio-headers
          curl --fail --silent http://127.0.0.1:8080/runtime-config.js --output /tmp/fisio-runtime.js
          grep -F 'https://api.example.test' /tmp/fisio-runtime.js

  n8n_json_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate n8n workflow JSON files
        run: |
          node -e "const fs=require('fs'); const path=require('path'); const root='n8n/Fisio_IA_Agent'; const walk=(dir)=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):path.join(dir,e.name)); const files=walk(root).filter(f=>f.endsWith('.json')); if(!files.length){throw new Error('No se encontraron workflows JSON');} for(const p of files){const raw=fs.readFileSync(p,'utf8'); JSON.parse(raw); if(p.includes('/vnext/') && /(?:fisio-backend|n8n-n8n)\.b5xbaf\.easypanel\.host|uewhbaejcouenoufuwlq\.supabase\.co/.test(raw)){throw new Error('vNext contiene un endpoint productivo fijo: '+p);} console.log('OK', p);}"
