name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend_syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check backend syntax
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/routes/agent.js
          node --check src/routes/exercises.js
          node --check src/routes/patients.js
          node --check src/routes/professional.js
          node --check src/routes/telegram.js

  frontend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  n8n_json_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate n8n workflow JSON files
        run: |
          node -e "const fs=require('fs'); const path='n8n/Fisio_IA_Agent'; const files=fs.readdirSync(path).filter(f=>f.endsWith('.json')); if(!files.length){throw new Error('No se encontraron workflows JSON');} for(const f of files){const p=path+'/'+f; const txt=fs.readFileSync(p,'utf8').replace(/^\\uFEFF/, ''); JSON.parse(txt); console.log('OK', p);}"
