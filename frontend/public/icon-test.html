<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Icon Test</title>
<link rel="stylesheet" href="/material-symbols.css">
<style>
body { font-family: sans-serif; padding: 2rem; }
.test { margin: 1rem 0; padding: 1rem; border: 1px solid #ccc; }
.test .material-symbols-rounded { background: #eee; padding: 4px; }
</style>
</head>
<body>
<h1>Material Symbols Test</h1>

<div class="test">
<h3>Test 1: Class from material-symbols.css</h3>
<span class="material-symbols-rounded">home</span>
<span class="material-symbols-rounded">group</span>
<span class="material-symbols-rounded">euro</span>
<span class="material-symbols-rounded">psychology</span>
<span class="material-symbols-rounded">receipt_long</span>
<span class="material-symbols-rounded">event_available</span>
</div>

<div class="test">
<h3>Test 2: Inline style (bypass all CSS)</h3>
<span style="font-family:'Material Symbols Rounded'; font-feature-settings:'liga'; font-size:24px;">home</span>
<span style="font-family:'Material Symbols Rounded'; font-feature-settings:'liga'; font-size:24px;">group</span>
<span style="font-family:'Material Symbols Rounded'; font-feature-settings:'liga'; font-size:24px;">euro</span>
</div>

<div class="test">
<h3>Test 3: Unicode code points (bypass ligatures)</h3>
<span class="material-symbols-rounded">&#xe88a;</span>
<span class="material-symbols-rounded">&#xe7ef;</span>
<span class="material-symbols-rounded">&#xea58;</span>
</div>

<div class="test">
<h3>Test 4: Google Fonts CDN (independent load)</h3>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<span style="font-family:'Material Symbols Rounded'; font-feature-settings:'liga'; font-size:24px;" class="gf-test">home</span>
<span style="font-family:'Material Symbols Rounded'; font-feature-settings:'liga'; font-size:24px;" class="gf-test">group</span>
<span style="font-family:'Material Symbols Rounded'; font-feature-settings:'liga'; font-size:24px;" class="gf-test">euro</span>
</div>

<script>
document.fonts.ready.then(() => {
  const status = document.createElement('div');
  status.style.cssText = 'margin:1rem 0;padding:1rem;border:2px solid green;background:#e8f5e9;';
  let html = '<h3>Font Status:</h3><ul>';
  document.fonts.forEach(f => {
    html += '<li>' + f.family + ' — ' + f.status + '</li>';
  });
  html += '</ul>';
  status.innerHTML = html;
  document.body.insertBefore(status, document.body.firstChild);
});
</script>
</body>
</html>
